# MySQL 8 para el SGA (perfil "mysql"). Uso: docker compose up -d
# Las credenciales salen del archivo .env (no versionado);
services:
  mysql:
    image: mysql:8.4
    container_name: sga-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sga}
      MYSQL_USER: ${MYSQL_USER:-sga}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/Bogota
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - sga-mysql-data:/var/lib/mysql   # los datos sobreviven a reiniciar el contenedor
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sga-mysql-data:
