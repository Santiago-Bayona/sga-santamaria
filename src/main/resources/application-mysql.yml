spring:
  datasource:
    url: ${SGA_DB_URL:jdbc:mysql://localhost:3306/sga?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SGA_DB_USER:sga}
    password: ${SGA_DB_PASSWORD:${sga.secreto.db-password}}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
