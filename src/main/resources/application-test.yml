spring:
  datasource:
    url: jdbc:h2:mem:sgatest;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

sga:
  seguridad:
    jwt-secret: test-secret-sga-santamaria-no-usar-en-prod-123456
    jwt-expiracion-minutos: 30
  recordatorios:
    delay-inicial-ms: 600000
  vencimientos:
    delay-inicial-ms: 600000

logging:
  level:
    root: WARN
    co.edu.uniquindio.sga: INFO
