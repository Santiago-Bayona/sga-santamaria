openapi: 3.1.0
info:
  title: API SGA — Santamaría
  description: |-
    API RESTful del Sistema de Gestión de Alojamiento (SGA) de Santamaría.

    **Agregado principal:** Reserva.

    **Convenciones del proyecto**
    - Rutas en plural bajo `/api`. No hay `DELETE` (bajas lógicas) ni `PATCH`.
    - Las transiciones de estado son `POST` a un sustantivo de la acción (`/confirmacion`, `/cancelacion`, `/llegada`, `/salida`, `/no-show`).
    - Paginación: `pagina` desde 0, tamaño fijo de 10.
    - Dinero en pesos colombianos (COP), enteros, sin decimales (`int64`).
    - Fechas `yyyy-MM-dd`, horas `HH:mm:ss`, fecha-hora ISO-8601.

    **Códigos de error**
    - `400` formato inválido (Bean Validation) · `401` sin token · `403` rol sin permiso · `404` no existe · `409` viola una regla de negocio o hay conflicto · `500` fallo interno.

    **Seguridad:** JWT Bearer. Roles: `ADMIN`, `RECEPCION`, `SERVICIO`, `CANAL`, `HUESPED`.
  version: 1.0.0
  contact:
    name: Equipo SGA Santamaría
    email: sofia.santamariar@uqvirtual.edu.co
servers:
- url: http://localhost:8080
  description: Servidor de desarrollo local
tags:
- name: Autenticación
  description: Login y consulta del usuario del token (JWT).
- name: Operación
  description: Apoyo a la operación diaria de recepción, como el resumen de llegadas y salidas (con IA opcional y no bloqueante).
- name: Reservas
  description: 'Ciclo de vida del agregado Reserva: crear, consultar, confirmar, modificar, cancelar, llegada, salida, no-show, vencimiento.'
- name: Folios
  description: 'Cuenta de la reserva: cargos, pagos, reversos (RN-16) y cierre (RN-17).'
- name: Recordatorios
  description: Recordatorios de entrada y salida de una reserva (RN-23 a RN-25).
- name: Titulares
  description: Huésped titular de una reserva.
- name: Apartamentos
  description: 'Inventario: ficha, activación, tarifas, capacidad, estado operativo y fuera de servicio.'
- name: Alojamiento
  description: Ficha del alojamiento, configuración, normas, servicios adicionales y temporadas.
- name: Políticas de cancelación
  description: Versiones de la política de cancelación (RN-13, RN-22).
- name: Bloqueos
  description: Bloqueo de noches de un apartamento (RN-07).
- name: Disponibilidad y calendario
  description: Búsqueda de apartamentos libres y calendario de ocupación.
- name: Cotizaciones
  description: Cálculo del valor de una estancia (7.4).
- name: Canales externos
  description: 'Integración con canales externos: conciliación y conflictos (RN-19).'
- name: Novedades
  description: Novedades reportadas sobre un apartamento.
- name: Reportes
  description: 'Indicadores para la administración: ingresos, ocupación y reservas por canal.'
security:
- bearerAuth: []
paths:
  /api/auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión y obtener el token JWT
      operationId: iniciarSesion
      description: |-
        Caso de uso: `AuthController`.

        Público (no requiere token).

        Credenciales inválidas se informan con **400** (SolicitudAplicacionException), no con 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: recepcion
              password: '********'
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '500':
          $ref: '#/components/responses/ErrorInterno'
      security: []
  /api/auth/me:
    get:
      tags:
      - Autenticación
      summary: Consultar el usuario autenticado
      operationId: consultarUsuarioActual
      description: |-
        Caso de uso: `AuthController`.

        Público (no requiere token).

        La ruta está abierta en SecurityConfig, pero responde **401** si la petición no trae un JWT válido.
      responses:
        '200':
          description: Datos del usuario del token (sin token nuevo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
      security: []
  /api/reservas:
    post:
      tags:
      - Reservas
      summary: Crear una reserva PENDIENTE
      operationId: crearReserva
      description: |-
        Caso de uso: `CrearReservaUseCase`.

        Roles permitidos: `ADMIN`, `RECEPCION`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearReservaRequest'
            example:
              codigoTitular: TIT-0001
              identificacionApartamento: APT-301
              fechaEntrada: '2026-12-20'
              fechaSalida: '2026-12-23'
              acompanantes:
              - nombre: Luis Pérez
                fechaNacimiento: '1988-04-12'
              horaLlegadaEstimada: '15:00:00'
              canalOrigen: PORTAL
              mascotas: 1
      responses:
        '201':
          description: 'Reserva creada (cabecera Location: /api/reservas/{codigo})'
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDetalleResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |-
            La operación viola una regla de negocio:
            - RN-01: la estancia se solapa con una reserva activa del apartamento
            - RN-02 / 3.2: el total de ocupantes (titular incluido, facturables o no) excede la capacidad
            - RN-03: la fecha de salida no es posterior a la de entrada
            - RN-04: la fecha de entrada es anterior a hoy
            - RN-06 / 3.2: el titular no es un ocupante facturable
            - RN-07: alguna noche está bloqueada
            - Canal EXTERNO sin identificadorExterno (o canal propio con identificador): la combinación canal + identificador es la base de RN-19
            - RN-20: no cabe el tiempo de preparación entre la salida de una reserva y la entrada de otra
            - L-16: más de 2 mascotas
            - El apartamento no está activo o no tiene tarifa en todas las temporadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    get:
      tags:
      - Reservas
      summary: Buscar y filtrar reservas (paginado)
      operationId: listarReservas
      description: |-
        Caso de uso: `ListarReservasUseCase`.

        Roles permitidos: `ADMIN`, `RECEPCION`.

        Filtros opcionales (DTO `ListarReservasRequest`). Todos se combinan con AND.
      parameters:
      - name: fechaDesde
        in: query
        required: false
        description: Entrada desde
        schema:
          type: string
          format: date
      - name: fechaHasta
        in: query
        required: false
        description: Entrada hasta
        schema:
          type: string
          format: date
      - name: estado
        in: query
        required: false
        description: Estado de la reserva
        schema:
          $ref: '#/components/schemas/EstadoReserva'
      - name: identificacionApartamento
        in: query
        required: false
        description: Apartamento
        schema:
          type: string
      - name: canalOrigen
        in: query
        required: false
        description: Canal de origen
        schema:
          $ref: '#/components/schemas/CanalOrigen'
      - name: codigoTitular
        in: query
        required: false
        description: Titular
        schema:
          type: string
      - name: pagina
        in: query
        required: false
        description: Número de página, desde 0. El tamaño es fijo (10).
        schema:
          type: integer
          default: 0
          minimum: 0
      responses:
        '200':
          description: Página de reservas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaReservaResumenResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/reservas/{codigo}:
    get:
      tags:
      - Reservas
      summary: Consultar una reserva
      operationId: consultarReserva
      description: |-
        Caso de uso: `ConsultarReservaUseCase`.

        Roles permitidos: `ADMIN`, `RECEPCION`.
      parameters:
      - name: codigo
        in: path
        required: true
        description: Código de la reserva, p. ej. RES-2026-00001
        schema:
          type: string
      responses:
        '200':
          description: Reserva encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDetalleResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      tags:
      - Reservas
      summary: Modificar fechas, apartamento, ocupantes o mascotas
      operationId: modificarReserva
      description: |-
        Caso de uso: `ModificarReservaUseCase`.

        Roles permitidos: `ADMIN`, `RECEPCION`.

        La diferencia de valor (positiva o negativa) se registra como ajuste en el folio (RN-14).
      parameters:
      - name: codigo
        in: path
        required: true
        description: Código de la reserva, p. ej. RES-2026-00001
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificarReservaRequest'
      responses:
        '200':
          description: Modificación aplicada; informa el ajuste de valor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModificacionReservaResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |-
            La operación viola una regla de negocio:
            - RN-14: solo se modifica una reserva PENDIENTE o CONFIRMADA
            - RN-14: se repiten las validaciones de creación (RN-01, RN-02, RN-03, RN-04, RN-07, RN-20)
            - RN-22: la política de cancelación congelada no cambia al modificar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/reservas/estado/{estado}:
    get:
      tags:
      - Reservas
      summary: Listar reservas por estado
      operationId: consultarReservasPorEstado
      description: |-
        Caso de uso: `ConsultarReservaPorEstadoUseCase`.

        Roles permitidos: `ADMIN`, `RECEPCION`.
      parameters:
      - name: estado
        in: path
        required: true
        description: Estado de la reserva
        schema:
          $ref: '#/components/schemas/EstadoReserva'
      - name: pagina
        in: query
        required: false
        description: Número de página, desde 0. El tamaño es fijo (10).
        schema:
          type: integer
          default: 0
          minimum: 0
      responses:
        '200':
          description: Página de reservas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaReservaResumenResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/reservas/titular/{codigoTitular}:
    get:
      tags:
      - Reservas
      summary: Historial de reservas de un titular
      operationId: consultarHistorialDeTitular
      description: |-
        Caso de uso: `ConsultarHistorialReservasUseCase`.

        Roles permitidos: `ADMIN`, `RECEPCION`, `HUESPED`.
      parameters:
      - name: codigoTitular
        in: path
        required: true
        description: Código del titular
        schema:
          type: string
      - name: pagina
        in: query
        required: false
        description: Número de página, desde 0. El tamaño es fijo (10).
        schema:
          type: integer
          default: 0
          minimum: 0
      responses:
        '200':
          description: Página de reservas del titular
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaReservaResumenResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/operacion/resumen-diario:
    get:
      tags:
      - Operación
      summary: Resumen diario de llegadas y salidas previstas
      operationId: generarResumenDiario
      description: |-
        Caso de uso: `GenerarResumenDiarioUseCase`.

        Roles permitidos: `ADMIN`, `RECEPCION`.

        Devuelve las llegadas (reservas CONFIRMADAS que entran ese día) y las salidas (reservas EN_CURSO que salen ese día), con un texto de resumen. El texto lo redacta un modelo de IA si está habilitado; si la IA está apagada, tarda o falla, la respuesta es igual de exitosa (**200**) con el resumen básico, `generadoPorIa: false` y el motivo en `motivoDegradacion`. La IA nunca impide operar. Al modelo solo se le envían códigos de reserva, apartamentos, horas y número de personas.
      parameters:
      - name: fecha
        in: query
        required: false
        description: Día del resumen. Si no se envía, es hoy.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Resumen del día, con o sin IA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenDiarioResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/reservas/llegadas:
    get:
      tags:
      - Reservas
      summary: Llegadas previstas de un día
      operationId: consultarLlegadasPrevistas
      description: |-
        Caso de uso: `ConsultarLlegadasPrevistasUseCase`.

        Roles permitidos: `ADMIN`, `RECEPCION`.
      parameters:
      - name: fecha
        in: query
        required: true
        description: Fecha de entrada
        schema:
          type: string
          format: date
      - name: pagina
        in: query
        required: false
        description: Número de página, desde 0. El tamaño es fijo (10).
        schema:
          type: integer
          default: 0
          minimum: 0
      responses:
        '200':
          description: Página de reservas que llegan ese día
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaReservaResumenResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/reservas/salidas:
    get:
      tags:
      - Reservas
      summary: Salidas previstas de un día
      operationId: consultarSalidasPrevistas
      description: |-
        Caso de uso: `ConsultarSalidasPrevistasUseCase`.

        Roles permitidos: `ADMIN`, `RECEPCION`.
      parameters:
      - name: fecha
        in: query
        required: true
        description: Fecha de salida
        schema:
          type: string
          format: date
      - name: pagina
        in: query
        required: false
        description: Número de página, desde 0. El tamaño es fijo (10).
        schema:
          type: integer
          default: 0
          minimum: 0
      responses:
        '200':
          description: Página de reservas que salen ese día
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaReservaResumenResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/reservas/{codigo}/confirmacion:
    post:
      tags:
      - Reservas
      summary: Confirmar una reserva
      operationId: confirmarReserva
      description: |-
        Caso de uso: `ConfirmarReservaUseCase`.

        Roles permitidos: `ADMIN`, `RECEPCION`.
      parameters:
      - name: codigo
        in: path
        required: true
        description: Código de la reserva, p. ej. RES-2026-00001
        schema:
          type: string
      responses:
        '200':
          description: Reserva confirmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDetalleResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |-
            La operación viola una regla de negocio:
            - RN-08: solo se confirma desde PENDIENTE
            - RN-09: falta la hora estimada de llegada
            - RN-21: la reserva superó el plazo de confirmación
            - Falta el pago del anticipo configurado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/reservas/{codigo}/cancelacion:
    post:
      tags:
      - Reservas
      summary: Cancelar una reserva
      operationId: cancelarReserva
      description: |-
        Caso de uso: `CancelarReservaUseCase`.

        Roles permitidos: `ADMIN`, `RECEPCION`.
      parameters:
      - name: codigo
        in: path
        required: true
        description: Código de la reserva, p. ej. RES-2026-00001
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelarReservaRequest'
            example:
              motivo: El huésped cambió sus fechas de viaje
      responses:
        '200':
          description: Cancelada; retorna la retención según la política congelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidacionPoliticaResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |-
            La operación viola una regla de negocio:
            - RN-08: solo se cancela desde PENDIENTE o CONFIRMADA (no desde EN_CURSO ni estados finales)
            - RN-12: al cancelar la reserva deja de ser activa y libera sus noches
            - RN-13 / RN-22: la retención se calcula con la versión de la política congelada en la reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/reservas/{codigo}/llegada:
    post:
      tags:
      - Reservas
      summary: Registrar la llegada del grupo (check-in)
      operationId: registrarLlegada
      description: |-
        Caso de uso: `RegistrarLlegadaUseCase`.

        Roles permitidos: `ADMIN`, `RECEPCION`.
      parameters:
      - name: codigo
        in: path
        required: true
        description: Código de la reserva, p. ej. RES-2026-00001
        schema:
          type: string
      responses:
        '204':
          description: Llegada registrada; la reserva pasa a EN_CURSO
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |-
            La operación viola una regla de negocio:
            - RN-08 / RN-10: solo desde CONFIRMADA y no antes de la fecha de entrada
            - RN-11: el apartamento debe estar activo y PREPARADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/reservas/{codigo}/salida:
    post:
      tags:
      - Reservas
      summary: Registrar la salida del grupo (check-out)
      operationId: registrarSalida
      description: |-
        Caso de uso: `RegistrarSalidaUseCase`.

        Roles permitidos: `ADMIN`, `RECEPCION`.
      parameters:
      - name: codigo
        in: path
        required: true
        description: Código de la reserva, p. ej. RES-2026-00001
        schema:
          type: string
      - name: X-Autor
        in: header
        required: false
        description: 'Quién autoriza el cierre con saldo pendiente. Por defecto: sistema.'
        schema:
          type: string
          default: sistema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarSalidaRequest'
      responses:
        '204':
          description: Salida registrada; la reserva pasa a FINALIZADA y el folio se cierra
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |-
            La operación viola una regla de negocio:
            - RN-08: solo puede salir una reserva EN_CURSO
            - La salida no puede ser anterior al registro de llegada
            - RN-17: el folio no cierra con saldo distinto de cero sin autorización (motivoAutorizacion)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/reservas/{codigo}/no-show:
    post:
      tags:
      - Reservas
      summary: Declarar no-show
      operationId: declararNoShow
      description: |-
        Caso de uso: `DeclararNoShowUseCase`.

        Roles permitidos: `ADMIN`, `RECEPCION`.
      parameters:
      - name: codigo
        in: path
        required: true
        description: Código de la reserva, p. ej. RES-2026-00001
        schema:
          type: string
      responses:
        '200':
          description: No-show declarado; retorna la retención
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidacionPoliticaResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
