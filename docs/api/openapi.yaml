          type: string
    TramoCancelacionResponse:
      type: object
      properties:
        diasAntelacionMinima:
          type: integer
        porcentajeRetencion:
          type: integer
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: 'JWT. Va como `Authorization: Bearer <token>`. En `/api/auth/me` viene vacío.'
        username:
          type: string
        rol:
          $ref: '#/components/schemas/RolUsuario'
        nombre:
          type: string
    CanalOrigen:
      type: string
      enum:
      - PORTAL
      - DIRECTO
      - EXTERNO
      description: Canal por el que entra la reserva. EXTERNO exige identificadorExterno (RN-19).
    EstadoReserva:
      type: string
      enum:
      - PENDIENTE
      - CONFIRMADA
      - EN_CURSO
      - FINALIZADA
      - CANCELADA
      - NO_SHOW
      description: 'Estados de la reserva (RN-08). Activas: PENDIENTE, CONFIRMADA, EN_CURSO; terminales: FINALIZADA, CANCELADA, NO_SHOW.'
    EstadoOperativo:
      type: string
      enum:
      - PREPARADO
      - OCUPADO
      - PENDIENTE_PREPARACION
      - EN_PREPARACION
      - FUERA_DE_SERVICIO
      description: Condición física del apartamento (F-09). Solo PREPARADO puede recibir un grupo (RN-11).
    TipoCargo:
      type: string
      enum:
      - ALOJAMIENTO
      - SERVICIO_ADICIONAL
      - AJUSTE
      - PENALIDAD
      description: Tipo de cargo del folio.
    MedioPago:
      type: string
      enum:
      - EFECTIVO
      - TARJETA
      - TRANSFERENCIA
      description: Medio con el que se registra un pago (RN-15).
    TipoRecordatorio:
      type: string
      enum:
      - ENTRADA
      - SALIDA
      description: Evento que origina el recordatorio (RN-23).
    EstadoRecordatorio:
      type: string
      enum:
      - PROGRAMADO
      - ENVIADO
      - FALLIDO
      - CANCELADO
      description: Estado del recordatorio.
    GravedadNovedad:
      type: string
      enum:
      - BAJA
      - MEDIA
      - ALTA
      description: Gravedad de una novedad del apartamento.
    SituacionNoche:
      type: string
      enum:
      - DISPONIBLE
      - OCUPADA
      - BLOQUEADA
      description: Situación de una noche en el calendario.
    RolUsuario:
      type: string
      enum:
