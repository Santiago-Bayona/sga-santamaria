          type: string
        estado:
          $ref: '#/components/schemas/EstadoReserva'
        identificacionApartamento:
          type: string
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        codigoTitular:
          type: string
        totalOcupantes:
          type: integer
        valorTotal:
          type: integer
          format: int64
          description: pesos, sin decimales (3.4).
    ReservasPorCanalResponse:
      type: object
      properties:
        canal:
          $ref: '#/components/schemas/CanalOrigen'
        total:
          type: integer
          format: int64
        canceladas:
          type: integer
          format: int64
        noShow:
          type: integer
          format: int64
    ResultadoConciliacionResponse:
      type: object
      properties:
        tipo:
          type: string
        reserva:
          $ref: '#/components/schemas/ReservaDetalleResponse'
        conflicto:
          $ref: '#/components/schemas/ConflictoCanalResponse'
    ServicioAdicionalResponse:
      type: object
      properties:
        nombre:
          type: string
        valor:
          type: integer
          format: int64
          description: pesos.
        generaCargo:
          type: boolean
    TarifaResponse:
      type: object
      properties:
        idTemporada:
          type: string
        valorPorOcupante:
          type: integer
          format: int64
          description: pesos, sin decimales.
    TemporadaResponse:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        base:
          type: boolean
        periodos:
          type: array
          items:
            $ref: '#/components/schemas/PeriodoAnualResponse'
    TitularResponse:
      type: object
