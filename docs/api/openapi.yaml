components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido en `POST /api/auth/login`.
  responses:
    DatosInvalidos:
      description: La petición no cumple el formato esperado (Bean Validation) o es una solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-12-01T10:15:30'
            status: 400
            error: Solicitud inválida
            mensaje: Bean Validation rechazó el cuerpo.
            ruta: /api/reservas
            detalles:
            - 'codigoTitular: El código del titular es obligatorio'
    NoAutenticado:
      description: Falta el token JWT o no es válido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Prohibido:
      description: El rol del usuario no tiene permiso para este recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NoEncontrado:
      description: El recurso no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-12-01T10:15:30'
            status: 404
            error: Recurso no encontrado
            mensaje: No existe la reserva RES-2026-99999
            ruta: /api/reservas/RES-2026-99999
            detalles: []
    ReglaDeNegocio:
      description: La operación viola una regla de negocio o hay un conflicto con el estado actual
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-12-01T10:15:30'
            status: 409
            error: Regla de dominio
            mensaje: La fecha de entrada no puede ser anterior a hoy.
            ruta: /api/reservas
            detalles: []
    ErrorInterno:
      description: Error interno; el mensaje no expone detalle técnico
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ActualizarApartamentoRequest:
      type: object
      required:
      - identificacionApartamento
      - nombre
      - descripcion
      - dormitorios
      - imagenes
      - indiceImagenPrincipal
      - dotacion
      properties:
        identificacionApartamento:
          type: string
          minLength: 1
        nombre:
          type: string
          minLength: 1
        descripcion:
          type: string
          minLength: 1
        dormitorios:
          type: integer
          minimum: 1
        imagenes:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 10
        indiceImagenPrincipal:
          type: integer
          minimum: 0
        dotacion:
          type: array
          items:
            type: string
    ActualizarConfiguracionAlojamientoRequest:
      type: object
      required:
      - horaEntrada
      - horaSalida
      - tiempoPreparacionMinutos
      - plazoConfirmacionHoras
      - horaLimiteNoShow
      - umbralEdadFacturable
      - porcentajeAnticipo
      - antelacionRecordatorioEntradaHoras
      - antelacionRecordatorioSalidaHoras
      properties:
        horaEntrada:
          type: string
          format: time
        horaSalida:
          type: string
          format: time
        tiempoPreparacionMinutos:
          type: integer
          minimum: 0
          description: 'minutos: la Ficha pide 2 h 30 min (150), que en horas enteras no cabe.'
        plazoConfirmacionHoras:
          type: integer
          minimum: 1
        horaLimiteNoShow:
          type: string
          format: time
        umbralEdadFacturable:
          type: integer
          minimum: 0
        porcentajeAnticipo:
          type: integer
          minimum: 0
          maximum: 100
        antelacionRecordatorioEntradaHoras:
          type: integer
          minimum: 1
        antelacionRecordatorioSalidaHoras:
          type: integer
          minimum: 1
    ActualizarDatosAlojamientoRequest:
      type: object
      required:
      - nombre
      - descripcion
      - ciudad
      - direccion
      - latitud
      - longitud
